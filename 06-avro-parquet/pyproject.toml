[project]
name = "dq06-avro-parquet"
version = "0.1.0"
description = "Avro and Parquet: schemas in serialization formats"
requires-python = ">=3.12,<3.14"
dependencies = [
    "inventory-data",
    "fastavro>=1.12",
    "pyarrow>=18",
    "pandas>=2.2",
]

[tool.uv]
package = false

[tool.uv.sources]
inventory-data = { path = "../inventory-data", editable = true }
