[project]
name = "dq09-ml-error-detection"
version = "0.1.0"
description = "ML-based detection of data errors (scikit-learn, PyOD, Splink)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "inventory-data",
    "pandas>=2.2",
    "scikit-learn>=1.9",
    "pyod>=3.6",
    "splink>=5.0",
]

[tool.uv]
package = false

[tool.uv.sources]
inventory-data = { path = "../inventory-data", editable = true }
