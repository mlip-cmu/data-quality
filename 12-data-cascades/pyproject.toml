[project]
name = "dq12-data-cascades"
version = "0.1.0"
description = "Data cascades in the inventory system (simulation)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "inventory-data",
    "marimo>=0.25",
    "altair>=6",
    "pandas>=2.2",
]

[tool.uv]
package = false

[tool.uv.sources]
inventory-data = { path = "../inventory-data", editable = true }
