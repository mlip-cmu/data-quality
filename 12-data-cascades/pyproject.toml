[project]
name = "dq12-data-cascades"
version = "0.1.0"
description = "Data cascades in the inventory system (simulation)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "inventory-data",
    "altair>=6",
    "pandas>=2.2",
    "jupyterlab>=4.6.4",
    "nbconvert>=7.17.1",
    "ipykernel>=7.3.0",
    "vl-convert-python>=1.9.0.post1",
]

[tool.uv]
package = false

[tool.uv.sources]
inventory-data = { path = "../inventory-data", editable = true }
