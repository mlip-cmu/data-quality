[project]
name = "dq10-drift-detection"
version = "0.1.0"
description = "Detecting concept, data, and schema drift"
requires-python = ">=3.12,<3.14"
dependencies = [
    "inventory-data",
    "marimo>=0.25",
    "altair>=6",
    "pandas>=2.2",
    "scikit-learn>=1.9",
    "scipy>=1.14",
    "river>=0.26",
    "evidently>=0.7.23",
]

[tool.uv]
package = false

[tool.uv.sources]
inventory-data = { path = "../inventory-data", editable = true }
