[project]
name = "dq05-pydantic-llm"
version = "0.1.0"
description = "Pydantic schemas for LLM output and REST APIs (LiteLLM, Anthropic SDK, FastAPI)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "inventory-data",
    "pydantic>=2.13",
    "litellm>=1.103",
    "anthropic>=1.0",
    "fastapi>=0.141",
    "httpx>=0.28",
    "rapidfuzz>=3.14",
]

[tool.uv]
package = false

[tool.uv.sources]
inventory-data = { path = "../inventory-data", editable = true }
