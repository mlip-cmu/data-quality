[project]
name = "dq04-schemaless-exchange"
version = "0.1.0"
description = "Schema-less data exchange and CSV/JSON schemas"
requires-python = ">=3.12,<3.14"
dependencies = [
    "inventory-data",
    "pandas>=2.2",
    "frictionless>=5.19,<5.20",
    "jsonschema>=4.26",
]

[tool.uv]
package = false

[tool.uv.sources]
inventory-data = { path = "../inventory-data", editable = true }
