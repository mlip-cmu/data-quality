[project]
name = "dq08-quality-rules-and-repair"
version = "0.1.0"
description = "Data quality rules and repair (DuckDB SQL, HoloClean-style repair)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "inventory-data",
    "duckdb>=1.5",
    "pandas>=2.2",
    "rapidfuzz>=3.14",
]

[tool.uv]
package = false

[tool.uv.sources]
inventory-data = { path = "../inventory-data", editable = true }
