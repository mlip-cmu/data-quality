[project]
name = "dq14-data-documentation"
version = "0.1.0"
description = "Data documentation (Data Card) and defensive consumer-side tests"
requires-python = ">=3.12,<3.14"
dependencies = [
    "inventory-data",
    "pandas>=2.2",
    "pandera[pandas]>=0.33",
    "pytest>=8",
    "tabulate>=0.9",
]

[tool.uv]
package = false

[tool.uv.sources]
inventory-data = { path = "../inventory-data", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
